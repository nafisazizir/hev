name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --group dev --extra serve
      - run: PYTHONDONTWRITEBYTECODE=1 HF_HUB_OFFLINE=1 uv run pytest -p no:cacheprovider
      - run: uv build
