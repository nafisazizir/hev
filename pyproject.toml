[project]
name = "hev"
version = "0.0.1"
description = "An order-invariant, Jev-inspired decision model: typed questions in, calibrated probabilities out, one forward pass."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "datasets>=3.0",
    "numpy>=2.0",
    "peft>=0.15",
    "pydantic>=2.9",
    "torch>=2.6,<2.9",
    "transformers>=4.51,<4.58",
]

[project.optional-dependencies]
serve = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "matplotlib>=3.9",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
